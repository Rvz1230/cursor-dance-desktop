# CursorDance Desktop — Static Analysis Configuration
#
# 三层防线之「验证层」：
#   - flutter_lints（基础）
#   - custom_lint 插件（设计令牌强制）
#   - dart analyze（类型/语法）

include: package:flutter_lints/flutter.yaml

analyzer:
  plugins:
    - custom_lint

  exclude:
    - lib/custom_lint.dart
    - lib/lints/**

  errors:
    # 令牌 lint 规则 — 全部视为 error
    no_hardcoded_font_size: error
    no_hardcoded_border_radius: error
    no_hardcoded_spacing: error

linter:
  rules:
    sort_child_properties_last: true
    avoid_print: true
